# ---------------------------------------------------------------------------
# VOID·SPACE — full local stack (SRS §9.2)
#
#   pnpm dev:up    -> infra + edge, then migrations, RLS and contract deploy
#   pnpm dev       -> api, worker, web in watch mode (natively, fast iteration)
#
# Profiles:
#   infra : postgres, redis                                 (data tier)
#   app   : containerized api/worker/web (alternative to `pnpm dev`, §9.1)
# ---------------------------------------------------------------------------
name: void-space

x-restart: &default-restart
  restart: unless-stopped

x-dns-host-gateway:
  &host-gateway # Lets the containerized edge reach api/web running natively via `pnpm dev`.
  extra_hosts:
    - 'host.docker.internal:host-gateway'

services:
  # ---------------------------------------------------------------- data tier
  #
  # Profiles, and why the data tier carries two.
  #
  # The api and worker services declare `depends_on: postgres/redis`, and Compose refuses to
  # build a project whose dependency sits in a profile it was not asked for — `--profile app up`
  # used to fail with `service "worker" depends on undefined service "redis"`. Listing `app` here as
  # well as `infra` says the true thing: the application tier cannot exist without its data tier, so
  # asking for the application gets you the database it runs on. Selecting `infra` alone still starts
  # only the data tier, which is what the local-development workflow wants.
  #
  # Anvil is the zero-setup local chain. Configure CHAIN_RPC_URL, CHAIN_ID=43113 and the Fuji
  # contract/signer values in .env when running against Avalanche Fuji.
  postgres:
    <<: *default-restart
    image: postgres:16-alpine
    # `scripts/dev-up.sh` starts the `infra` profile and then waits for this
    # service before applying migrations. Keeping postgres out of that profile
    # made every clean local bring-up wait for a container that was never made.
    profiles: ['infra', 'app']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voidspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voidspace_pw}
      POSTGRES_DB: ${POSTGRES_DB:-voidspace}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-void_app_pw}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-void_platform_pw}
      # Deterministic sorting/collation for reproducible indexes and tests.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '${POSTGRES_PORT:-5432}:5432' # dev only (§9.2)
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Bootstrap roles (void_app / void_platform) run once on first init.
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-voidspace} -d ${POSTGRES_DB:-voidspace}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    <<: *default-restart
    image: redis:7-alpine
    profiles: ['infra', 'app']
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    ports:
      - '${REDIS_PORT:-6379}:6379' # dev only (§9.2)
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  anvil:
    <<: *default-restart
    image: ghcr.io/foundry-rs/foundry:stable
    profiles: ['local-chain']
    entrypoint: ['anvil']
    command: ['--host', '0.0.0.0', '--port', '8545', '--chain-id', '${ANVIL_CHAIN_ID:-31337}']
    ports:
      - '${ANVIL_PORT:-8545}:8545' # dev only: api/worker talk to it natively
    # §3.9.1 — the chain is ephemeral by default (reset with the container).
    # To persist state across restarts, uncomment the volume and the extra args:
    #   volumes: [anvilstate:/data]
    #   command: [..., "--state-interval", "5", "--dump-state", "/data/state.json", "--load-state", "/data/state.json"]
    healthcheck:
      # JSON-RPC eth_blockNumber is the documented readiness probe (§9.3).
      test: ['CMD-SHELL', 'cast block-number --rpc-url http://localhost:8545 >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ------------------------------------------------------ edge / proxy tier
  nginx:
    <<: [*default-restart, *host-gateway]
    image: nginx:alpine
    profiles: ['edge']
    ports:
      - '80:80'
      - '443:443'
    environment:
      EDGE_WEB_UPSTREAM: ${EDGE_WEB_UPSTREAM:-host.docker.internal:3000}
      EDGE_API_UPSTREAM: ${EDGE_API_UPSTREAM:-host.docker.internal:4000}
      TLS_CERT_PATH: ${TLS_CERT_PATH:-/etc/nginx/certs/void-space.crt}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-/etc/nginx/certs/void-space.key}
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ['CMD-SHELL', 'nginx -t && wget -qO- http://127.0.0.1/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ------------------------------------------------------- application tier
  # Containerized alternative to `pnpm dev` (§9.1). Enable with:
  #   docker compose --profile app up -d
  api:
    <<: *host-gateway
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    profiles: ['app']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      SKETCHFAB_CLIENT_ID: ${SKETCHFAB_CLIENT_ID:-}
      SKETCHFAB_CLIENT_SECRET: ${SKETCHFAB_CLIENT_SECRET:-}
      SKETCHFAB_REDIRECT_URI: ${SKETCHFAB_REDIRECT_URI:-}
      SKETCHFAB_WEB_ORIGIN: ${SKETCHFAB_WEB_ORIGIN:-}
      SIWE_ENABLED: ${SIWE_ENABLED:-false}
      SIWE_DOMAIN: ${SIWE_DOMAIN:-localhost}
      SIWE_URI: ${SIWE_URI:-https://localhost}
      LEARNING_AGENT_ENGINE: ${LEARNING_AGENT_ENGINE:-bullmq}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-}
      INNGEST_BASE_URL: ${INNGEST_BASE_URL:-}
      AI_IMAGE_ENABLED: ${AI_IMAGE_ENABLED:-false}
      LEARNING_TEACHER_DAILY_JOBS: ${LEARNING_TEACHER_DAILY_JOBS:-30}
      LEARNING_LEARNER_DAILY_JOBS: ${LEARNING_LEARNER_DAILY_JOBS:-10}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_CONTAINER_ENDPOINT:-${S3_ENDPOINT:-}}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-https://localhost}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_TEXT_BASE_URL: ${AI_TEXT_BASE_URL:-}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-}
      AI_TEXT_FALLBACK_MODEL: ${AI_TEXT_FALLBACK_MODEL:-}
      AI_TEXT_PROTOCOL: ${AI_TEXT_PROTOCOL:-}
      AI_TEXT_API_KEY: ${AI_TEXT_API_KEY:-}
      AI_TEXT_TIMEOUT_MS: ${AI_TEXT_TIMEOUT_MS:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://void_app:void_app_pw@postgres:5432/voidspace?schema=public
      PLATFORM_DATABASE_URL: postgresql://void_platform:void_platform_pw@postgres:5432/voidspace?schema=public
      REDIS_URL: redis://redis:6379
      CHAIN_RPC_URL: ${CHAIN_RPC_URL:-}
      CHAIN_ID: ${CHAIN_ID:-31337}
      CHAIN_EXPLORER_URL: ${CHAIN_EXPLORER_URL:-https://testnet.snowtrace.io}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS}
      CONTRACT_STATE_PATH: /shared/contracts.json
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Must match the worker exactly: the API stages an upload, the worker picks that file up and
      # pins it. Two different roots (or one container without the volume) means the pin worker
      # never sees the bytes it was told to pin.
      STAGING_DIR: /var/lib/void-space/uploads/staging
      STAGING_MAX_BYTES: ${STAGING_MAX_BYTES:-5368709120}
    volumes:
      - uploads:/var/lib/void-space/uploads
    restart: unless-stopped

  worker:
    <<: *host-gateway
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    profiles: ['app']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      SKETCHFAB_CLIENT_ID: ${SKETCHFAB_CLIENT_ID:-}
      SKETCHFAB_CLIENT_SECRET: ${SKETCHFAB_CLIENT_SECRET:-}
      SKETCHFAB_REDIRECT_URI: ${SKETCHFAB_REDIRECT_URI:-}
      SKETCHFAB_WEB_ORIGIN: ${SKETCHFAB_WEB_ORIGIN:-}
      SIWE_ENABLED: ${SIWE_ENABLED:-false}
      SIWE_DOMAIN: ${SIWE_DOMAIN:-localhost}
      SIWE_URI: ${SIWE_URI:-https://localhost}
      LEARNING_AGENT_ENGINE: ${LEARNING_AGENT_ENGINE:-bullmq}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-}
      INNGEST_BASE_URL: ${INNGEST_BASE_URL:-}
      AI_IMAGE_ENABLED: ${AI_IMAGE_ENABLED:-false}
      LEARNING_TEACHER_DAILY_JOBS: ${LEARNING_TEACHER_DAILY_JOBS:-30}
      LEARNING_LEARNER_DAILY_JOBS: ${LEARNING_LEARNER_DAILY_JOBS:-10}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_CONTAINER_ENDPOINT:-${S3_ENDPOINT:-}}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-https://localhost}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_TEXT_BASE_URL: ${AI_TEXT_BASE_URL:-}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-}
      AI_TEXT_FALLBACK_MODEL: ${AI_TEXT_FALLBACK_MODEL:-}
      AI_TEXT_PROTOCOL: ${AI_TEXT_PROTOCOL:-}
      AI_TEXT_API_KEY: ${AI_TEXT_API_KEY:-}
      AI_TEXT_TIMEOUT_MS: ${AI_TEXT_TIMEOUT_MS:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      PLATFORM_DATABASE_URL: postgresql://void_platform:void_platform_pw@postgres:5432/voidspace?schema=public
      NODE_ENV: production
      DATABASE_URL: postgresql://void_app:void_app_pw@postgres:5432/voidspace?schema=public
      REDIS_URL: redis://redis:6379
      CHAIN_RPC_URL: ${CHAIN_RPC_URL:-}
      CHAIN_ID: ${CHAIN_ID:-31337}
      CHAIN_EXPLORER_URL: ${CHAIN_EXPLORER_URL:-https://testnet.snowtrace.io}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS}
      PLATFORM_SIGNER_SEED: ${PLATFORM_SIGNER_SEED}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STAGING_DIR: /var/lib/void-space/uploads/staging
    volumes:
      - uploads:/var/lib/void-space/uploads
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    profiles: ['app']
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # Server-side calls only; the browser talks to nginx (§3.1).
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
