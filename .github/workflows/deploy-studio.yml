name: Deploy to GitHub Pages

# Builds the browser bundle (esbuild) and publishes it to GitHub Pages on every
# push to main. The heavy sculptcore WASM artifact is built from source in CI
# but cached by the sculptcore submodule commit, so a typical TS-only change
# skips the Emscripten toolchain entirely and only re-bundles.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployment needs these; id-token is required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; let a newer master push supersede an
# in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/studio-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/studio-web/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/studio-web/pnpm-lock.yaml

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # ---- sculptcore WASM (cached by submodule SHA) ------------------------
      # esbuild consumes sculptcore/typescript/build/sculptcore-browser.{wasm,js}.
      # Those are gitignored build outputs; we rebuild them only when the
      # sculptcore submodule commit changes.
      - name: Resolve sculptcore commit
        id: sc
        run: echo "sha=$(git -C sculptcore rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache sculptcore WASM bundle
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            apps/studio-web/sculptcore/typescript/build/sculptcore-browser.wasm
            apps/studio-web/sculptcore/typescript/build/sculptcore-browser.js
          key: sc-wasm-release-v2-${{ steps.sc.outputs.sha }}-${{ hashFiles('apps/studio-web/sculptcore/emsdkVersion.txt') }}

      # emsdk is a ~2.4 GB git-cloned toolchain; cache it across runs so only the
      # first WASM build (or an emsdk version bump) pays the install cost.
      - name: Cache emsdk toolchain
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: apps/studio-web/sculptcore/emsdk
          key: emsdk-${{ hashFiles('apps/studio-web/sculptcore/emsdkVersion.txt') }}

      - name: Build sculptcore WASM
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        working-directory: apps/studio-web/sculptcore
        env:
          # Trust the checked-in source/brush/kernels/generated/*.brush.gen.h
          # headers instead of building the native `sbrushc` host tool. Building
          # sbrushc would force a full native CMake configure (Vulkan + wgpu_native,
          # neither available/prebuilt for linux), which is exactly what this WASM-
          # only runner must avoid. sbrushCodegen() fails loudly if any header is
          # missing, so a stale submodule checkout can't silently ship old kernels.
          SBRUSH_SKIP_NATIVE_CODEGEN: '1'
        run: |
          pnpm install --frozen-lockfile          # make.mjs deps (yargs, ...)
          if [ ! -x emsdk/emsdk ]; then
            node make.mjs install-emsdk            # git-clones + installs pinned emsdk/cmake/ninja
          fi
          # --release = CMAKE_BUILD_TYPE=Release: optimized, debug-info-free WASM
          # for end users (the default RelWithDebInfo carries DWARF and is ~5x
          # larger). See documentation/releaseBuild.md.
          # No wgpu-native and no native codegen: both are the native (NOT BUILD_WASM)
          # toolchain; the WASM build uses browser WebGPU + checked-in brush headers.
          node make.mjs configure wasm --release
          node make.mjs build wasm --release       # internally skips sbrushc (env above); emits sculptcore-browser.{wasm,js}

      # ---- App bundle + site assembly --------------------------------------
      # Release mode: no source maps at all, in the main bundle or the addon
      # bundles (both used to carry a full inline map — ~20 MB on entry_point.js
      # alone). See documentation/releaseBuild.md.
      - name: Bundle app (esbuild, release)
        run: |
          node -e "require('node:fs').rmSync('build', {recursive: true, force: true})"
          pnpm build:release

      - name: Assemble Pages site
        env:
          VOID_STUDIO_API_URL: ${{ vars.VOID_STUDIO_API_URL }}
        run: node tools/package-site.mjs --pages

      # Regression guard for the release build: a stray source map (or a bundle
      # still pointing at one) means --release didn't reach one of the esbuild
      # invocations. Fail loudly rather than shipping tens of MB of maps.
      - name: Verify no source maps shipped
        run: |
          maps=$(find _site -name '*.map' -print)
          if [ -n "$maps" ]; then
            echo "release build shipped source maps:"; echo "$maps"; exit 1
          fi
          # Inline maps are unambiguous (`sourceMappingURL=data:`); a bare
          # sourceMappingURL comment can legitimately appear inside vendored
          # sources, and a real one is already covered by the *.map check.
          if grep -rl 'sourceMappingURL=data:' _site/build --include='*.js' | head -n 5 | grep .; then
            echo "release build left inline source maps (files above)"; exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/studio-web/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

