<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="cache-control" content="max-age=0"/>
  <meta http-equiv="cache-control" content="no-cache"/>
  <meta http-equiv="expires" content="0"/>
  <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT"/>
  <meta http-equiv="pragma" content="no-cache"/>

  <meta charset="utf-8">
  <meta name="description" content="VOID·STUDIO — the AI-assisted 3D creation environment for VOID·SPACE.">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- Matches `--vs-bg` so the browser chrome is the same graphite as the app ground. -->
  <meta name="theme-color" content="#08080a">
  <title>VOID·STUDIO</title>

  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
  <!-- Raster fallback: an older browser that cannot use the SVG still gets the mark. -->
  <link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <style>
      /*
       * VOID·SPACE design tokens.
       *
       * These are the same values apps/web/src/app/globals.css defines, copied rather than
       * imported because this shell is a static document that boots before any bundler output
       * exists. The ground surfaces and the text ramp come from the "Ethereal Glass" system; the
       * accent is `--fc-heat`, which is what the marketplace's `brand` Tailwind token actually
       * maps to. When those values move, move these too — a Studio whose dark grey is a slightly
       * different dark grey from the marketplace is the kind of drift nobody reports and everybody
       * notices.
       *
       * Only the tokens this shell needs are here. The editor's own widgets are themed from
       * scripts/voidspace/theme.ts, which is the equivalent file for the in-canvas UI.
       */
      :root {
        --vs-bg: #08080a;
        --vs-surface: #101013;
        --vs-surface-2: #16161a;
        --vs-surface-3: #1d1d22;
        --vs-line: #232329;
        --vs-line-strong: #34343d;

        --vs-fg: #f3f3f5;
        --vs-fg-dim: #9d9daa;
        --vs-fg-faint: #6c6c7a;

        --vs-heat: #fa5d19;
        --vs-heat-warm: #ff7a3d;
        --vs-signal: #3ddc97;

        --vs-font-sans: 'Plus Jakarta Sans', 'Segoe UI', ui-sans-serif, system-ui, sans-serif;
        --vs-font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

        --vs-radius: 10px;
        --vs-ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      /*
       * Typography is self-hosted, for the same reason the marketplace self-hosts it: a shell that
       * renders nothing until fonts.googleapis.com answers is broken on a locked-down network, and
       * the container build cannot reach Google at all.
       */
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('assets/brand/fonts/plus-jakarta-sans-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('assets/brand/fonts/plus-jakarta-sans-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('assets/brand/fonts/plus-jakarta-sans-700.woff2') format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('assets/brand/fonts/jetbrains-mono-400.woff2') format('woff2');
      }

      body, html {
          margin: 0px;
          padding: 0px;
          width: 100%;
          height: 100%;
          overflow: hidden;
          position: fixed;
      }

      #loading-overlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          z-index: 1000;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          /*
           * The two low-opacity radial sources are the platform's depth treatment, not decoration:
           * a flat #08080a full-bleed surface reads as "the app has not started", whereas a little
           * light behind the mark reads as "the app is starting". Same reasoning as globals.css.
           */
          background-color: var(--vs-bg);
          background-image:
            radial-gradient(900px 420px at 50% -10%, rgba(250, 93, 25, 0.10), transparent 70%),
            radial-gradient(700px 500px at 12% 110%, rgba(110, 168, 254, 0.06), transparent 70%);
          color: var(--vs-fg-dim);
          font-family: var(--vs-font-sans);
          font-size: 13px;
          letter-spacing: 0.01em;
          /* never swallow input, even if a load error leaves this around */
          pointer-events: none;
          transition: opacity 0.25s var(--vs-ease);
      }

      #loading-overlay.hidden {
          opacity: 0;
      }

      /* The brand lockup: the marketplace's cube mark beside the Studio wordmark. */
      .vo-brand {
          display: flex;
          align-items: center;
          gap: 11px;
          margin-bottom: 6px;
      }

      .vo-brand svg {
          width: 30px;
          height: 30px;
          color: var(--vs-heat);
          flex: none;
      }

      .vo-wordmark {
          color: var(--vs-fg);
          font-size: 19px;
          font-weight: 600;
          /* Tracking is tightened at display size, matching the marketplace wordmark exactly. */
          letter-spacing: -0.02em;
      }

      /*
       * The attribution line.
       *
       * It is here because the Studio is a separate product that publishes *into* VOID·SPACE, and a
       * Creator arriving from the marketplace should never be unsure which application they are in.
       * Set in mono and dimmed so it reads as provenance rather than as a second title.
       */
      .vo-parent {
          font-family: var(--vs-font-mono);
          font-size: 10.5px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: var(--vs-fg-faint);
      }

      /*
       * Smaller than the upstream 48px/4px ring, and on the accent.
       *
       * The old ring was sized to be the entire loading state, because it sat under a large logo
       * image. With a brand lockup above it, a 48px ring stops reading as progress and starts
       * competing with the mark. 22px reads as "something is happening" and nothing more, which is
       * all an indeterminate spinner is entitled to say.
       */
      #loading-spinner {
          width: 22px;
          height: 22px;
          border: 2px solid var(--vs-line-strong);
          border-top-color: var(--vs-heat);
          border-radius: 50%;
          animation: loading-spin 0.9s linear infinite;
      }

      @keyframes loading-spin {
          to {
              transform: rotate(360deg);
          }
      }

      @media (prefers-reduced-motion: reduce) {
          #loading-spinner {
              animation-duration: 2.5s;
          }
      }
  </style>

  <script type="module">
    window.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    })
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    })

    if (0) {
      let _addEvt = window.addEventListener;
      let cbmap = new Map();

      window.addEventListener = function (type, cb, opt) {
        let cb2 = cb;

        if (type.startsWith("key")) {
          cb2 = function (e) {
            console.log(type, "cb", cb);
            return cb(e);
          }

          cbmap.set(cb, cb2);
        }

        return _addEvt.call(window, type, cb2, opt);
      }

      let _remEvt = window.removeEventListener;
      window.removeEventListener = function (type, cb, opt) {
        let cb2 = cbmap.get(cb);
        if (cb2) {
          cb = cb2;
        }

        return _remEvt.call(window, type, cb, opt);
      }
    }

    /* Loading overlay: shown from first paint until the app UI exists. */
    const LOADING_TIMEOUT_MS = 60000

    function hideLoadingOverlay() {
      const overlay = document.getElementById('loading-overlay')
      if (!overlay || overlay.classList.contains('hidden')) {
        return
      }

      overlay.classList.add('hidden')
      window.setTimeout(() => overlay.remove(), 500)
    }

    window.hideLoadingOverlay = hideLoadingOverlay

    function loadingOverlayError(msg) {
      const spinner = document.getElementById('loading-spinner')
      const text = document.getElementById('loading-text')

      if (spinner) {
        spinner.style.display = 'none'
      }
      if (text) {
        text.textContent = msg
      } else {
        hideLoadingOverlay()
      }
    }

    /* The shipped app is an embedder like any other: it mounts one instance
       into the document body through mountVoidStudio, which resolves with the
       screen already built. See documentation/embedding.md. */
    window.addEventListener('load', () => {
      /* Backstop: never leave the overlay up if the mount stalls. */
      const backstop = setTimeout(hideLoadingOverlay, LOADING_TIMEOUT_MS)

      import("./build/entry_point.js").then(entry_point => entry_point.init()).then(() => {
        clearTimeout(backstop)
        hideLoadingOverlay()
      }).catch(err => {
        clearTimeout(backstop)
        console.error(err)
        loadingOverlayError('Failed to load application; see the console for details.')
      });
    })
  </script>
</head>
<body>
<div id="loading-overlay">
  <!--
    The mark is inlined rather than an <img src="assets/brand/mark.svg">.

    Inlining is what lets `currentColor` work: an <img> is an isolated document, so its stroke has
    nothing to inherit and the cube would render black on the graphite ground. It also removes a
    network round trip from the critical path — the first frame must not wait on a second file.
  -->
  <div class="vo-brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1"
         stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2.6 21 7.5v9L12 21.4 3 16.5v-9z"/>
      <path d="M3 7.5l9 4.9 9-4.9M12 12.4v9"/>
    </svg>
    <span class="vo-wordmark">VOID·STUDIO</span>
  </div>
  <div id="loading-spinner"></div>
  <div id="loading-text">Loading&hellip;</div>
  <div class="vo-parent">VOID·SPACE · 3D creation environment</div>
</div>
<img id="iconsheet" style="display:none" src="assets/iconsheet.svg"></img>
</body>
</html>
