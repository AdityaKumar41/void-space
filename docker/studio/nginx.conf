# ---------------------------------------------------------------------------
# VOID·STUDIO edge (VS2-SRS-1.0 §9.2) — TLS termination on 8443.
#
# Deliberately a sibling of docker/nginx/ rather than a reuse of it. The two products are separate
# deployments (§3.1) and this config is where that becomes visible: it terminates a different port,
# proxies to different upstreams, and — most importantly — sends headers VOID·SPACE does not.
#
# ## Why the COOP/COEP headers are here and not in Next.js
#
# The editor fork is a WebGPU application that uses SharedArrayBuffer, which a browser only exposes
# in a cross-origin-isolated context (apps/studio-web/VENDOR.md). Those headers must cover *every*
# response the page loads — including the IPFS gateway responses under /ipfs — and Next.js cannot set
# a header on a response it does not author. Setting them only on the HTML document produces a page
# that loads and then fails at the first buffer allocation, which is a far harder failure to diagnose
# than a missing header.
#
# ## The app tier is partly running
#
# studio-api exists as a container (`docker/studio-api.Dockerfile`, under the `app` profile), so
# /studio/api/ answers for real once it is up. studio-web does not: the editor's image needs the
# sculptcore toolchain, so run it natively (`pnpm studio:fork:dev`, port 5007) until it does. That
# makes / and /api answer 502 by design in the meantime, while /healthz answers without touching an
# upstream — which is what makes `studio:dev:up` verifiable on its own.
#
# Note that when the editor *is* served from this edge, the VOID·SPACE panel uses this same origin for
# `/studio/api/` rather than a hardcoded port (see `studioApiBaseUrl` in
# apps/studio-web/scripts/voidspace/bridge_panel.ts). Serving the two from one origin is what makes
# that possible, and it is also why STUDIO_CORS_ORIGINS only matters for the native dev server.
#
# That "by design" only holds because every upstream is reached through a *variable* rather than an
# `upstream {}` block. nginx resolves a static `upstream` server name once, at configuration-load
# time, and refuses to start when the name does not resolve — which turned the documented 502 into a
# crash loop, with the edge down, /healthz included. A `proxy_pass` whose host comes from a variable
# is resolved per request against Docker's embedded DNS, so an absent service yields the intended
# 502 and everything else on the edge keeps working.
# ---------------------------------------------------------------------------

# Docker's embedded DNS. `valid=10s` bounds how long a stale address survives a container restart;
# the default (forever) would keep proxying to a dead IP after a rebuild.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8443 ssl;
  http2 on;
  server_name localhost;

  # The same dev certificates the VOID·SPACE edge uses (docker/scripts/gen-dev-certs.sh). Reusing
  # them is a local-development convenience only: the two hosts are separate in every real
  # deployment, and nothing about the product boundary depends on a shared certificate.
  ssl_certificate /etc/nginx/certs/void-space.crt;
  ssl_certificate_key /etc/nginx/certs/void-space.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Resolved per request — see the note above. Ports match docker-compose.studio.yml's app-tier plan
  # (studio-web 3000, studio-api 4100).
  set $studio_web_upstream "studio-web:3000";
  set $studio_api_upstream "studio-api:4100";
  set $studio_ipfs_upstream "studio-ipfs:8080";

  # ------------------------------------------------------------------ isolation
  #
  # `require-corp` on the embedder policy and `same-origin` on the opener policy are the pair a
  # browser requires before it will hand out a SharedArrayBuffer. `credentialless` would also work
  # and is narrower, but it changes how cross-origin subresources carry credentials; the editor loads
  # its assets from its own origin, so the stricter, more predictable pair costs nothing here.
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  # Uploads go through the API as multipart with the file part last (§2.4), so the body ceiling has
  # to clear VOID·SPACE's 200 MB per-asset limit (VS-SRS-2.0 FR-3.1) with room for the metadata and
  # the multipart framing around it.
  client_max_body_size 220m;

  # ---------------------------------------------------------------- health check
  location = /healthz {
    access_log off;
    # `default_type`, not `add_header Content-Type`. A nested `add_header` discards *every* header
    # inherited from the enclosing server block — nginx's inheritance here is all-or-nothing, not
    # additive — so setting the content type with `add_header` silently dropped the three isolation
    # headers above from this response. `default_type` sets the same thing without touching the
    # add_header chain.
    default_type text/plain;
    return 200 "void-studio edge ok\n";
  }

  # ------------------------------------------------------------------- studio API
  #
  # §6.4's surface lives under /studio/api/v1, which is distinct from VOID·SPACE's /api/v1 on
  # purpose: a shared path prefix is how two products end up proxying each other's routes.
  location /studio/api/ {
    proxy_pass http://$studio_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Phase 2's collaboration gateway (§4.12) upgrades over this same origin, and an upgrade stalled
    # by a short read timeout is indistinguishable from a broken editor.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  # --------------------------------------------------------------------- IPFS
  #
  # Read-only, because this is the working-copy gateway the editor renders from. Publishing never
  # writes through here — it uploads to VOID·SPACE over REST (§3.6).
  location /ipfs/ {
    proxy_pass http://$studio_ipfs_upstream/ipfs/;
    proxy_set_header Host $host;
    # Content is addressed by CID, so it is immutable and safe to cache hard. Without this the editor
    # re-fetches the same mesh on every viewport reload.
    add_header Cache-Control "public, max-age=31536000, immutable" always;

    # Restated, because the `add_header` above discards everything inherited from the server block —
    # see the note on /healthz. Dropping `Cross-Origin-Resource-Policy` here would be the quiet kind
    # of regression: the editor keeps working (a same-origin subresource does not need CORP under
    # COEP) while the gateway content silently becomes embeddable by any other origin.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
  }

  # ------------------------------------------------------------------ editor shell
  location / {
    proxy_pass http://$studio_web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
